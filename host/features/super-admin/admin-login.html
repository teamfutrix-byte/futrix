  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Login | FUTRIX Ecosystem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --surface-border: rgba(56, 189, 248, 0.2);
      --primary: #38bdf8;
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 800; color: #fff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .brand-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.4rem; font-weight: 800; color: #fff;
    }
    .brand-subtitle {
      font-size: 0.78rem; color: var(--text-muted);
    }
    .form-group {
      display: flex; flex-direction: column; gap: 0.4rem;
      margin-bottom: 1.2rem;
    }
    label {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      padding: 0.95rem 1.1rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 16, 23, 0.45);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    input:focus {
      border-color: var(--primary);
      background: rgba(13, 16, 23, 0.65);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .btn-submit {
      width: 100%; padding: 0.85rem; margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none; border-radius: 10px; color: #fff;
      font-family: 'Sora', sans-serif; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .error-toast {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444; padding: 0.75rem; border-radius: 8px; font-size: 0.82rem;
      margin-bottom: 1.2rem; display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">FUTRIX</div>
        <div class="brand-subtitle">Super Admin Access Portal</div>
      </div>
    </div>

    <div id="errorToast" class="error-toast"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" required placeholder="admin@futrix.com" />
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-submit">Login to Super Admin Console</button>
    </form>
  </div>
